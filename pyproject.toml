[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
# PEP 660 editable wheels use '__editable__*.pth'; Python 3.13 skips underscore-leading .pth files,
# so editable installs never put the project on sys.path unless cwd happens to be the repo root.
# Non-editable installs copy the package into site-packages (works everywhere).
# Prefer: UV_NO_EDITABLE=1 uv sync   and   UV_NO_EDITABLE=1 uv run ...
package = true

[project]
name = "shrutilens"
version = "0.1.0"
description = "Audio-first structured conversational assessment runtime."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
shrutilens = "shrutilens.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
